name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    name: detect changed packages
    runs-on: ubuntu-latest
    outputs:
      linux-packages: ${{ steps.changes.outputs.linux-packages }}
      macos-packages: ${{ steps.changes.outputs.macos-packages }}
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 detect changed packages
        id: changes
        run: |
          LINUX_PACKAGES="agave agave-2_0 agave-2_1 agave-2_2 agave-2_3 agave-3_0 agave-3_1 cargo-dylint cargo-interactive-update codex-cli dylint-link godot knope mdt ollama pina pnpm pnpm-10 pnpm-11 pnpm-standalone racket-minimal surfpool wait-for-them"
          MACOS_PACKAGES="agave agave-2_0 agave-2_1 agave-2_2 agave-2_3 agave-3_0 agave-3_1 cargo-dylint cargo-interactive-update codex-cli codexbar dylint-link godot gpg-suite knope mdt nordvpn ollama pina pnpm pnpm-10 pnpm-11 pnpm-standalone racket-minimal steam surfpool zoom"

          build_all=false

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE="${{ github.event.before }}"
          fi

          # Build all on first push or if base is missing
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            build_all=true
          fi

          if [ "$build_all" = "false" ]; then
            CHANGED_FILES=$(git diff --name-only "$BASE" HEAD)

            # Build all if flake lock or CI config changed (flake.nix is excluded
            # since it typically only changes to register new packages, which are
            # already detected via the packages/ directory)
            if echo "$CHANGED_FILES" | grep -qE '^(flake\.lock|\.github/workflows/ci\.yml)$'; then
              build_all=true
            fi
          fi

          if [ "$build_all" = "true" ]; then
            LINUX_JSON=$(echo "$LINUX_PACKAGES" | tr ' ' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            MACOS_JSON=$(echo "$MACOS_PACKAGES" | tr ' ' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            CHANGED_PKGS=$(echo "$CHANGED_FILES" | grep '^packages/' | cut -d'/' -f2 | sort -u)

            LINUX_CHANGED=""
            MACOS_CHANGED=""
            for pkg in $CHANGED_PKGS; do
              if echo "$LINUX_PACKAGES" | grep -qw "$pkg"; then
                LINUX_CHANGED="$LINUX_CHANGED $pkg"
              fi
              if echo "$MACOS_PACKAGES" | grep -qw "$pkg"; then
                MACOS_CHANGED="$MACOS_CHANGED $pkg"
              fi
            done

            if [ -n "$LINUX_CHANGED" ]; then
              LINUX_JSON=$(echo "$LINUX_CHANGED" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
            else
              LINUX_JSON="[]"
            fi
            if [ -n "$MACOS_CHANGED" ]; then
              MACOS_JSON=$(echo "$MACOS_CHANGED" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
            else
              MACOS_JSON="[]"
            fi
          fi

          echo "linux-packages=$LINUX_JSON" >> "$GITHUB_OUTPUT"
          echo "macos-packages=$MACOS_JSON" >> "$GITHUB_OUTPUT"
          echo "Linux packages to build: $LINUX_JSON"
          echo "macOS packages to build: $MACOS_JSON"

  validate:
    name: validate flake
    runs-on: ubuntu-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 🔍 validate flake
        run: nix flake show

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 🔍 lint
        run: nix shell nixpkgs#dprint nixpkgs#nixfmt-rfc-style nixpkgs#shfmt -c dprint check

      - name: 🔍 check mdt blocks
        run: nix run .#mdt -- check

  test-update-script:
    name: "test update script (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 🧪 run update dry-run
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            case "$(uname -m)" in
              arm64) NU_ARCH="aarch64-apple-darwin" ;;
              x86_64) NU_ARCH="x86_64-apple-darwin" ;;
            esac
            echo "Installing nushell 0.112.1 (${NU_ARCH})..."
            curl -fsSL "https://github.com/nushell/nushell/releases/download/0.112.1/nu-0.112.1-${NU_ARCH}.tar.gz" | tar xz
            "./nu-0.112.1-${NU_ARCH}/nu" scripts/update --dry-run
          else
            nix shell nixpkgs#nushell -c nu scripts/update --dry-run
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: "build ${{ matrix.package }} (linux)"
    needs: [detect-changes, validate, test-update-script]
    if: needs.detect-changes.outputs.linux-packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.linux-packages) }}
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 🏗️ build ${{ matrix.package }}
        run: nix build .#${{ matrix.package }}

  build-macos:
    name: "build ${{ matrix.package }} (macos)"
    needs: [detect-changes, validate, test-update-script]
    if: needs.detect-changes.outputs.macos-packages != '[]'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.macos-packages) }}
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 🏗️ build ${{ matrix.package }}
        run: nix build .#${{ matrix.package }}
