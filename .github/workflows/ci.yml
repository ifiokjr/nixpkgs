name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# contents: read is the workflow-wide default. Each nix job additionally
# requests id-token: write at job level (workflow-level is rejected by
# zizmor as overly broad) so magic-nix-cache can mint the OIDC token
# FlakeHub Cache authentication requires.
permissions:
  contents: read

jobs:
  detect-changes:
    name: detect changed packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      linux-packages: ${{ steps.changes.outputs.linux-packages }}
      macos-packages: ${{ steps.changes.outputs.macos-packages }}
      base-sha: ${{ steps.changes.outputs.base-sha }}
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: 🔍 detect changed packages
        id: changes
        run: |


          build_all=false

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE="${{ github.event.before }}"
          fi

          # Build all only when there is no base to diff against (first push
          # to main, workflow_dispatch). A flake.lock or ci.yml change must
          # NOT force a full matrix: the update script runs `nix flake
          # update` in every daily batch, so every update PR touches
          # flake.lock and a full run of macOS jobs (10x minutes) exhausts
          # the Actions plan. Unchanged packages are still exercised against
          # a bumped nixpkgs incrementally by later package PRs, and a full
          # validation run is available on demand via workflow_dispatch.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            build_all=true
            CHANGED_FILES=""
          else
            # Three-dot diff resolves the merge base, so a stale base.sha
            # never drags unrelated commits merged into main meanwhile into
            # the changed set.
            CHANGED_FILES=$(git diff --name-only "$BASE...HEAD")
          fi

          # Package lists are derived from the flake (ciPackages) so they can
          # never drift from the real package set — hand-maintained lists
          # silently rotted and disabled every build job.
          LINUX_ALL=$(nix eval --json .#ciPackages.x86_64-linux | jq -c .)
          MACOS_ALL=$(nix eval --json .#ciPackages.aarch64-darwin | jq -c .)

          if [ "$build_all" = "true" ]; then
            LINUX_JSON=$LINUX_ALL
            MACOS_JSON=$MACOS_ALL
          else
            CHANGED_PKGS=$(echo "$CHANGED_FILES" | grep '^packages/' | cut -d'/' -f2 | sort -u || true)

            # Intersect changed packages with the flake-derived per-platform
            # lists (aliases resolve to the same derivation as their target).
            LINUX_JSON=$(comm -12 <(echo "$LINUX_ALL" | jq -r '.[]' | sort) <(echo "$CHANGED_PKGS" | sort) | jq -R -s -c 'split("\n") | map(select(length > 0))')
            MACOS_JSON=$(comm -12 <(echo "$MACOS_ALL" | jq -r '.[]' | sort) <(echo "$CHANGED_PKGS" | sort) | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          {
            echo "linux-packages=$LINUX_JSON"
            echo "macos-packages=$MACOS_JSON"
            echo "base-sha=$BASE"
          } >> "$GITHUB_OUTPUT"
          echo "Linux packages to build: $LINUX_JSON"
          echo "macOS packages to build: $MACOS_JSON"

  perf:
    name: performance regression check
    needs: [detect-changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 checkout base tree
        run: |
          set -euo pipefail
          BASE="${{ needs.detect-changes.outputs.base-sha }}"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            MB=$(git merge-base "$BASE" HEAD)
          else
            MB=$(git rev-parse HEAD)
          fi
          git worktree add "$PWD/base" "$MB"
          echo "comparing against merge-base $MB"

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: 🏗️ benchmark flake evaluation
        run: |
          set -euo pipefail
          bench() {
            local best=999999
            for _ in 1 2 3; do
              local start end secs
              start=$(date +%s%N)
              # --no-eval-cache: a warm eval cache would report ~0.1s for
              # both trees and the comparison would measure nothing.
              nix eval --no-eval-cache --json .#ciPackages.x86_64-linux > /dev/null
              end=$(date +%s%N)
              secs=$(( (end - start) / 100000000 ))
              if [ "$secs" -lt "$best" ]; then best=$secs; fi
            done
            # tenths of a second
            echo "$((best / 10)).$((best % 10))"
          }
          PR_EVAL=$(bench)
          cd "$PWD/base"
          BASE_EVAL=$(bench)
          cd "$GITHUB_WORKSPACE"
          echo "flake eval (best of 3): base=${BASE_EVAL}s pr=${PR_EVAL}s"
          # Fail only when meaningfully slower than the base tree and past an
          # absolute floor, so runner noise alone can never fail a PR.
          worse=$(awk -v a="$PR_EVAL" -v b="$BASE_EVAL" 'BEGIN{print (a > b * 1.25 && a > 30) ? 1 : 0}')
          if [ "$worse" = 1 ]; then
            echo "::error::flake evaluation regressed: ${BASE_EVAL}s -> ${PR_EVAL}s (>25% and >30s)"
            exit 1
          fi

      - name: 🏗️ check closure sizes of changed packages
        if: needs.detect-changes.outputs.linux-packages != '[]'
        run: |
          set -euo pipefail
          CHANGED=$(jq -r '.[]' <<< '${{ needs.detect-changes.outputs.linux-packages }}')
          # Closures expected to grow: the linux prebuilts gained
          # autoPatchelfHook, which finally pulls the glibc runtime into the
          # closure — the old closures were small only because the binaries
          # could not run at all.
          GROWTH_ALLOWLIST="cargo-clean-all pina wait-for-them"
          FAILED=0
          # nix path-info -S prints "size path", but the column order is not
          # guaranteed across nix versions: take whichever field is numeric.
          size_of() {
            nix path-info -S ".#$1" | awk '{if ($1 ~ /^[0-9]+$/) print $1; else if ($2 ~ /^[0-9]+$/) print $2}'
          }
          for pkg in $CHANGED; do
            pr_size=$(nix build --no-link ".#$pkg" 2>/dev/null && size_of "$pkg") || pr_size=""
            base_size=$(cd "$PWD/base" && nix build --no-link ".#$pkg" 2>/dev/null && size_of "$pkg") || base_size=""
            if [ -z "$pr_size" ] || [ -z "$base_size" ]; then
              echo "$pkg: skipped (does not build on one of the trees — new, renamed, or failing; build jobs own that verdict)"
              continue
            fi
            grew=$(awk -v a="$pr_size" -v b="$base_size" 'BEGIN{print (a > b * 1.25) ? 1 : 0}')
            human_pr=$(numfmt --to=iec "$pr_size")
            human_base=$(numfmt --to=iec "$base_size")
            if [ "$grew" = 1 ] && grep -qw "$pkg" <<< "$GROWTH_ALLOWLIST"; then
              echo "$pkg closure grew: ${human_base} -> ${human_pr} (allowlisted: prebuilts gained a working glibc runtime)"
            elif [ "$grew" = 1 ]; then
              echo "::error::$pkg closure grew more than 25%: ${human_base} -> ${human_pr}"
              FAILED=1
            else
              echo "$pkg closure: ${human_base} -> ${human_pr}"
            fi
          done
          exit "$FAILED"

  validate:
    name: validate flake
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: 🔍 validate flake
        run: nix flake show

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: 🔍 lint
        run: nix shell nixpkgs#dprint nixpkgs#nixfmt-rfc-style nixpkgs#shfmt -c dprint check

      - name: 🔍 check package catalog is current
        # Regenerates the docs/packages.md catalog from the flake and fails
        # when a package change lands without running scripts/catalog.
        # dprint fmt normalizes the generated table's padding.
        run: |
          nix shell nixpkgs#nushell nixpkgs#dprint -c sh -c 'nu scripts/catalog && dprint fmt docs/packages.md'
          git diff --exit-code docs/packages.md

      - name: 🔍 check mdt blocks
        # mdt.toml registers dprint as a formatter stage, so mdt needs it on
        # PATH to compare managed blocks against formatted output.
        run: nix shell nixpkgs#dprint -c nix run .#mdt -- check

      - name: 🔍 check github workflows
        run: nix build .#checks.x86_64-linux.github-workflows

  test-update-script:
    name: "test update script (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: 🧪 run update dry-run
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            case "$(uname -m)" in
              arm64) NU_ARCH="aarch64-apple-darwin" ;;
              x86_64) NU_ARCH="x86_64-apple-darwin" ;;
            esac
            echo "Installing nushell 0.112.1 (${NU_ARCH})..."
            curl -fsSL "https://github.com/nushell/nushell/releases/download/0.112.1/nu-0.112.1-${NU_ARCH}.tar.gz" | tar xz
            "./nu-0.112.1-${NU_ARCH}/nu" scripts/update --dry-run
          else
            nix shell nixpkgs#nushell -c nu scripts/update --dry-run
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: "build ${{ matrix.package }} (linux)"
    needs: [detect-changes, validate, test-update-script]
    if: needs.detect-changes.outputs.linux-packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Empty until the one-time Cachix setup in the readme is done; the
      # cachix step is skipped entirely when unset.
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
    strategy:
      fail-fast: false
      # max-parallel caps concurrency to avoid GitHub API rate-limit
      # exhaustion through the magic-nix-cache proxy
      max-parallel: 20
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.linux-packages) }}
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: 🔧 set up cachix
        if: ${{ env.CACHIX_SIGNING_KEY != '' }}
        uses: cachix/cachix-action@v16
        with:
          name: ifiokjr-nixpkgs
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: 🏗️ build ${{ matrix.package }}
        run: nix build .#${{ matrix.package }}

  downstream:
    name: "downstream ${{ matrix.project }}"
    needs: [detect-changes, validate, test-update-script]
    if: contains(needs.detect-changes.outputs.linux-packages, 'pnpm') || contains(needs.detect-changes.outputs.macos-packages, 'pnpm') || github.event_name == 'push'
    runs-on: ubuntu-latest
    # A shell evaluation plus one install: minutes of work. Without a bound a
    # hung step burns GitHub's six-hour job cap and holds ci-status with it.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: monochange
            repository: monochange/monochange
            command: pnpm install --frozen-lockfile
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: 📥 checkout downstream ${{ matrix.project }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          path: downstream/${{ matrix.project }}

      - name: 📥 patch downstream devenv.yaml
        working-directory: downstream/${{ matrix.project }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("devenv.yaml")
          text = path.read_text()
          text = text.replace("url: github:ifiokjr/nixpkgs", f"url: path:{Path.cwd().parents[1]}")
          path.write_text(text)
          PY

      - name: 🔧 devenv update
        working-directory: downstream/${{ matrix.project }}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if nix shell nixpkgs#devenv -c devenv update ifiokjr-nixpkgs; then
              break
            fi
            echo "devenv update attempt $i failed, retrying in 10s..."
            if [ "$i" = 3 ]; then
              echo "devenv update failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done

      - name: 🧪 test downstream ${{ matrix.project }}
        working-directory: downstream/${{ matrix.project }}
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$PWD/.xdg-data"
          export XDG_CACHE_HOME="$PWD/.xdg-cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$PWD/.home"

          # This project's shell runs its own tasks on entry, including its
          # pre-commit hooks over every file. Those are unrelated to what we
          # check here — that the freshly built pnpm installs this lockfile —
          # and they are where the job hung: dprint's exec plugin shells out to
          # rustfmt, rustup then fetches the pinned nightly toolchain into the
          # throwaway HOME, and nothing bounds that download. Force the hooks
          # off so entering the shell only builds the environment.
          for i in 1 2 3; do
            if nix shell nixpkgs#devenv -c env \
              HOME="$PWD/.home" \
              PNPM_HOME="$XDG_DATA_HOME/pnpm" \
              XDG_CACHE_HOME="$PWD/.xdg-cache" \
              XDG_DATA_HOME="$XDG_DATA_HOME" \
              devenv --option git-hooks.enable:bool false shell ${{ matrix.command }}; then
              break
            fi
            echo "devenv shell attempt $i failed, repairing nix store and retrying in 30s..."
            if [ "$i" = 3 ]; then
              echo "devenv shell failed after 3 attempts"
              exit 1
            fi
            nix-store --verify --check-contents --repair 2>/dev/null || true
            sleep 30
          done

  build-macos:
    name: "build ${{ matrix.package }} (macos)"
    needs: [detect-changes, validate, test-update-script]
    if: needs.detect-changes.outputs.macos-packages != '[]'
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Empty until the one-time Cachix setup in the readme is done; the
      # cachix step is skipped entirely when unset.
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
    strategy:
      fail-fast: false
      # max-parallel caps concurrency to avoid GitHub API rate-limit
      # exhaustion through the magic-nix-cache proxy
      max-parallel: 20
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.macos-packages) }}
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: 🔧 set up cachix
        if: ${{ env.CACHIX_SIGNING_KEY != '' }}
        uses: cachix/cachix-action@v16
        with:
          name: ifiokjr-nixpkgs
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: 🏗️ build ${{ matrix.package }}
        run: nix build .#${{ matrix.package }}

  ci-status:
    name: ci-status
    needs: [detect-changes, validate, lint, test-update-script, perf, build-linux, build-macos, downstream]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 🚦 aggregate results
        run: |
          failed=$(jq '[.[] | select(.result != "success" and .result != "skipped")] | length' <<< '${{ toJson(needs) }}')
          if [ "$failed" -gt 0 ]; then
            jq . <<< '${{ toJson(needs) }}'
            exit 1
          fi
