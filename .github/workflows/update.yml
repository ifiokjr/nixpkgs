name: update packages

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# contents: read is the workflow-wide default; the mirror and update jobs
# request the writes they need at job level (workflow-level is rejected by
# zizmor as overly broad once a second job exists).
permissions:
  contents: read

jobs:
  # Expand mirror.json into the matrix the mirror job runs over, so adding a
  # source is a mirror.json entry and nothing else.
  matrix:
    name: read mirror sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sources: ${{ steps.read.outputs.sources }}
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 📋 list mirror sources
        id: read
        run: echo "sources=$(jq -c '[.sources[].name]' mirror.json)" >> "$GITHUB_OUTPUT"

  # Mirror upstream release artifacts to this repo's GitHub releases before
  # anything updates: every asset is downloaded, verified against upstream's
  # own integrity data, attested with this repo's build provenance, and only
  # then published at tag mirror/<name>/<tag>. A version bump can never point
  # at bytes that were not mirrored first (scripts/update refuses to bump a
  # version whose mirror release is missing).
  mirror:
    name: mirror ${{ matrix.source }}
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: ${{ fromJson(needs.matrix.outputs.sources) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # create the mirror release and upload assets
      attestations: write # record build provenance for the staged artifacts
      id-token: write # OIDC identity for the attestation
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 stage upstream artifacts
        id: stage
        run: |
          nix shell nixpkgs#nushell -c nu scripts/mirror --prepare --source ${{ matrix.source }}
          staged=$(find .mirror-staging -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          echo "staged=$staged" >> "$GITHUB_OUTPUT"
          echo "staged $staged new version(s)"

      # When everything is already mirrored there is nothing to attest,
      # publish or verify — the actions below require at least one subject.
      - name: 🧾 attest staged artifacts
        if: steps.stage.outputs.staged != '0'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .mirror-staging/**

      - name: 📦 publish mirror releases
        if: steps.stage.outputs.staged != '0'
        run: nix shell nixpkgs#nushell -c nu scripts/mirror --publish

      - name: 🔍 verify attestations on the published assets
        if: steps.stage.outputs.staged != '0'
        run: |
          set -euo pipefail
          # Attestations propagate through the API within moments; retry to
          # absorb that lag instead of failing a healthy mirror.
          for asset in .mirror-staging/*/*; do
            case "$asset" in *.json|*.sha256) continue ;; esac
            for _ in 1 2 3 4 5; do
              if gh attestation verify "$asset" -R "$GITHUB_REPOSITORY"; then
                echo "✅ $asset"
                break
              fi
              echo "waiting for attestation of $asset…"
              sleep 10
            done
            gh attestation verify "$asset" -R "$GITHUB_REPOSITORY"
          done

      # Backup copy of every mirrored artifact. Inactive until the repo has
      # B2_KEY_ID / B2_APPLICATION_KEY secrets (an application key scoped to
      # the bucket named by the B2_BUCKET variable); GitHub releases stay the
      # fetch path regardless.
      - name: 🗄 copy artifacts to Backblaze B2
        if: steps.stage.outputs.staged != '0'
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$B2_KEY_ID" ] || [ -z "$B2_APPLICATION_KEY" ] || [ -z "$B2_BUCKET" ]; then
            echo "B2 secrets or bucket not configured; skipping the backup copy."
            exit 0
          fi
          pipx install "b2==5.0.2"
          b2 authorize-account "$B2_KEY_ID" "$B2_APPLICATION_KEY"
          for dir in .mirror-staging/*/; do
            tag=$(basename "$dir")
            b2 sync --noDelete "$dir" "b2://$B2_BUCKET/nixpkgs-mirror/$tag/"
          done

  update:
    name: update packages
    needs: mirror
    # A single failed mirror source must not block updating the rest: the
    # updater gates every mirrored package on its own mirror release.
    if: ${{ !cancelled() && needs.mirror.result != 'cancelled' }}
    runs-on: ubuntu-latest
    # Bounded so a hung build or fetch cannot burn runner hours unnoticed.
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write
      # lets magic-nix-cache authenticate to FlakeHub Cache via OIDC
      id-token: write
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: 🔄 run update script
        id: update
        continue-on-error: true
        run: nix shell nixpkgs#nushell -c nu scripts/update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The update script bumps versions and hashes but never builds what it
      # changed, and a push made with GITHUB_TOKEN does not trigger ci.yml, so
      # nothing else did either: melos 8.9.0 landed on 2026-09-22 with a patch
      # upstream had invalidated, and every melos alias stayed unbuildable for
      # six days. Build each package the batch touched and revert the ones that
      # fail, so a broken bump cannot reach main while the rest still lands.
      - name: 🧪 build changed packages
        id: verify
        continue-on-error: true
        run: |
          set -uo pipefail

          changed=$(git diff --name-only | grep '^packages/' | cut -d/ -f2 | sort -u || true)
          if [ -z "$changed" ]; then
            echo "No package changes to build."
            exit 0
          fi

          buildable=$(nix eval --json .#ciPackages.x86_64-linux 2>/dev/null | jq -r '.[]' || true)
          if [ -z "$buildable" ]; then
            # Nothing can be verified against a flake that does not evaluate, so
            # undo the whole batch rather than commit it unbuilt.
            echo "::error::could not evaluate .#ciPackages.x86_64-linux — reverting the entire batch"
            git checkout HEAD -- packages flake.lock
            git clean -fdq packages
            echo "Reverted the whole batch: $changed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          reverted=""
          skipped=""

          for pkg in $changed; do
            if ! grep -qx "$pkg" <<< "$buildable"; then
              # Darwin-only packages (casks, macOS apps) cannot be built on this
              # runner. Their download URLs and hashes were already checked by
              # the update script's prefetch, but record them so an unbuildable
              # bump is visible rather than assumed good.
              echo "Skipping $pkg (not in the x86_64-linux package set)"
              skipped="$skipped $pkg"
              continue
            fi

            echo "::group::build $pkg"
            if nix build ".#$pkg" --no-link; then
              echo "✅ $pkg"
            else
              echo "❌ $pkg failed to build — reverting this package"
              reverted="$reverted $pkg"
              # Restore tracked files and drop anything the updater added
              # (e.g. a regenerated pubspec.lock.json) so the bump is fully undone.
              git checkout HEAD -- "packages/$pkg"
              git clean -fdq "packages/$pkg"
            fi
            echo "::endgroup::"
          done

          if [ -n "$reverted" ]; then
            echo "Reverted unbuildable updates:$reverted" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$skipped" ]; then
            echo "Not build-verified on this runner (darwin-only):$skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$reverted" ]; then
            exit 1
          fi

      - name: 📝 regenerate readme blocks (mdt)
        id: mdt
        # mdt.toml registers dprint as a formatter stage, so mdt needs dprint on
        # PATH to write already-aligned rows. This now emits formatted output on
        # its own; the dprint fmt step below stays as a safety net for files mdt
        # does not touch.
        run: nix shell nixpkgs#dprint -c nix run .#mdt -- update

      - name: 📦 regenerate the package catalog
        # A version bump changes docs/packages.md; without this the catalog
        # freshness check in ci.yml fails on the update commit itself.
        run: nix shell nixpkgs#nushell nixpkgs#dprint -c sh -c 'nu scripts/catalog && dprint fmt docs/packages.md'

      # mdt rewrites the version cells in readme.md but does not re-pad the
      # table columns, so a version whose length changes leaves the row
      # misaligned (this is how the agave-4_3 row broke dprint). Pushes made
      # with GITHUB_TOKEN do not trigger ci.yml, so nothing downstream would
      # catch it; format here before committing.
      - name: 🎨 format changed files (dprint)
        run: nix shell nixpkgs#dprint nixpkgs#nixfmt-rfc-style nixpkgs#shfmt -c dprint fmt

      - name: 📦 commit and push changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: update packages $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes detected, skipping commit."
          fi

      - name: 🚨 report update failures
        if: steps.update.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: |
          if [ "${{ steps.update.outcome }}" = "failure" ]; then
            echo "The update script failed for one or more packages."
            echo "Failed packages are listed in the '🔄 run update script' step log above."
          fi
          if [ "${{ steps.verify.outcome }}" = "failure" ]; then
            echo "One or more updated packages failed to build and were reverted."
            echo "See the '🧪 build changed packages' step log above."
          fi
          echo "Successful updates have already been committed and pushed."
          exit 1

  # The update job builds on Linux, so a bump that only breaks on macOS (a
  # patched source archive, a cask layout change) would still reach main
  # unseen. Build the packages that batch changed on aarch64-darwin, and fail
  # the workflow when one does not build — a push made with GITHUB_TOKEN does
  # not trigger ci.yml, so this is the only thing standing behind the darwin
  # side of an update batch.
  verify-macos:
    name: verify changed packages (macos)
    needs: update
    if: always() && needs.update.result != 'cancelled'
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 🧪 build packages changed by this update
        run: |
          set -uo pipefail

          # Only meaningful when the updater actually pushed a batch. Otherwise
          # HEAD is an unrelated commit and diffing it would rebuild packages
          # this run never touched.
          if ! git log -1 --format=%s | grep -q '^chore: update packages '; then
            echo "HEAD is not an update commit; nothing to verify."
            exit 0
          fi

          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            changed=$(git diff --name-only HEAD^ HEAD | grep '^packages/' | cut -d/ -f2 | sort -u || true)
          else
            changed=$(git show --name-only --format= HEAD | grep '^packages/' | cut -d/ -f2 | sort -u || true)
          fi
          if [ -z "$changed" ]; then
            echo "The update batch touched no packages."
            exit 0
          fi

          buildable=$(nix eval --json .#ciPackages.aarch64-darwin 2>/dev/null | jq -r '.[]' || true)
          if [ -z "$buildable" ]; then
            echo "::error::could not evaluate .#ciPackages.aarch64-darwin"
            exit 1
          fi

          failed=""
          for pkg in $changed; do
            if ! grep -qx "$pkg" <<< "$buildable"; then
              echo "Skipping $pkg (not in the aarch64-darwin package set)"
              continue
            fi
            echo "::group::build $pkg"
            if nix build ".#$pkg" --no-link; then
              echo "✅ $pkg"
            else
              echo "❌ $pkg"
              failed="$failed $pkg"
            fi
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "Packages changed by this batch that fail to build on darwin:$failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
