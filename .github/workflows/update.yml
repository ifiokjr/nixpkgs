name: update packages

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    name: update packages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          # registration on FlakeHub pending; flip back to true after
          # registering at flakehub.com to enable FlakeHub cache
          use-flakehub: false

      - name: 🔄 run update script
        id: update
        continue-on-error: true
        run: nix shell nixpkgs#nushell -c nu scripts/update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 regenerate readme blocks (mdt)
        id: mdt
        run: nix run .#mdt -- update

      - name: 📦 commit and push changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: update packages $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes detected, skipping commit."
          fi

      - name: 🚨 report update failures
        if: steps.update.outcome == 'failure'
        run: |
          echo "The update script failed for one or more packages."
          echo "Failed packages are listed in the '🔄 run update script' step log above."
          echo "Successful updates have already been committed and pushed."
          exit 1
