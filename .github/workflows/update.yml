name: update packages

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  # lets magic-nix-cache authenticate to FlakeHub Cache via OIDC
  id-token: write

jobs:
  update:
    name: update packages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: 🔄 run update script
        id: update
        continue-on-error: true
        run: nix shell nixpkgs#nushell -c nu scripts/update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 regenerate readme blocks (mdt)
        id: mdt
        # mdt.toml registers dprint as a formatter stage, so mdt needs dprint on
        # PATH to write already-aligned rows. This now emits formatted output on
        # its own; the dprint fmt step below stays as a safety net for files mdt
        # does not touch.
        run: nix shell nixpkgs#dprint -c nix run .#mdt -- update

      # mdt rewrites the version cells in readme.md but does not re-pad the
      # table columns, so a version whose length changes leaves the row
      # misaligned (this is how the agave-4_3 row broke dprint). Pushes made
      # with GITHUB_TOKEN do not trigger ci.yml, so nothing downstream would
      # catch it; format here before committing.
      - name: 🎨 format changed files (dprint)
        run: nix shell nixpkgs#dprint nixpkgs#nixfmt-rfc-style nixpkgs#shfmt -c dprint fmt

      - name: 📦 commit and push changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: update packages $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes detected, skipping commit."
          fi

      - name: 🚨 report update failures
        if: steps.update.outcome == 'failure'
        run: |
          echo "The update script failed for one or more packages."
          echo "Failed packages are listed in the '🔄 run update script' step log above."
          echo "Successful updates have already been committed and pushed."
          exit 1
