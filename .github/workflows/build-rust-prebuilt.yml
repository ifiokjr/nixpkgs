name: Build Rust Prebuilt Binary

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build"
        required: true
        type: choice
        options:
          - dylint
          - pina
          - cargo-clean-all
          - cargo-interactive-update
          - sbpf-linker
      version:
        description: "Version to build (without v prefix)"
        required: true
        type: string

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.config.outputs.repo }}
      bin: ${{ steps.config.outputs.bin }}
      features: ${{ steps.config.outputs.features }}
      no-default-features: ${{ steps.config.outputs.no-default-features }}
      tag: ${{ steps.config.outputs.tag }}
    steps:
      - name: Configure package
        id: config
        run: |
          VERSION="${{ inputs.version }}"
          echo "tag=prebuilt/${{ inputs.package }}/${VERSION}" >> "$GITHUB_OUTPUT"

          case "${{ inputs.package }}" in
            dylint)
              echo "repo=trailofbits/dylint" >> "$GITHUB_OUTPUT"
              echo "bin=cargo-dylint,dylint-link" >> "$GITHUB_OUTPUT"
              ;;
            pina)
              echo "repo=pina-rs/pina" >> "$GITHUB_OUTPUT"
              echo "bin=pina" >> "$GITHUB_OUTPUT"
              ;;
            cargo-clean-all)
              echo "repo=dnlmlr/cargo-clean-all" >> "$GITHUB_OUTPUT"
              echo "bin=cargo-clean-all" >> "$GITHUB_OUTPUT"
              ;;
            cargo-interactive-update)
              echo "repo=benjeau/cargo-interactive-update" >> "$GITHUB_OUTPUT"
              echo "bin=cargo-interactive-update" >> "$GITHUB_OUTPUT"
              ;;
            sbpf-linker)
              echo "repo=blueshift-gg/sbpf-linker" >> "$GITHUB_OUTPUT"
              echo "bin=sbpf-linker" >> "$GITHUB_OUTPUT"
              echo "features=upstream-gallery-22" >> "$GITHUB_OUTPUT"
              echo "no-default-features=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          ref: v${{ inputs.version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install system dependencies
        if: inputs.package == 'dylint'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y pkg-config libssl-dev libgit2-dev zlib1g-dev
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install openssl libgit2 zlib pkg-config
          fi

      - name: Install system dependencies (cargo-interactive-update)
        if: inputs.package == 'cargo-interactive-update'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y pkg-config libcurl4-openssl-dev
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install curl pkg-config
          fi

      - name: Install LLVM (sbpf-linker)
        if: inputs.package == 'sbpf-linker'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y llvm-22-dev
            echo "LLVM_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install llvm@22
            echo "LLVM_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"
          fi

      - name: Build binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ${{ needs.prepare.outputs.bin }}
          target: ${{ matrix.target }}
          archive: ${{ inputs.package }}-$target
          tar: unix
          checksum: sha256
          features: ${{ needs.prepare.outputs.features }}
          no-default-features: ${{ needs.prepare.outputs.no-default-features || 'false' }}
          locked: true
          ref: ${{ needs.prepare.outputs.tag }}
          dry-run: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}-${{ matrix.target }}
          path: |
            target/release/*.tar.gz
            target/release/*.sha256

  release:
    name: Create release and upload binaries
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create release and upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ inputs.package }} ${{ inputs.version }}
          body: |
            Prebuilt binaries for ${{ inputs.package }} v${{ inputs.version }}

            ## Platforms
            - aarch64-apple-darwin (macOS ARM)
            - x86_64-apple-darwin (macOS Intel)
            - aarch64-unknown-linux-gnu (Linux ARM)
            - x86_64-unknown-linux-gnu (Linux x86)

            ## Usage
            These binaries are built automatically for use with Nix packages.
          files: artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
