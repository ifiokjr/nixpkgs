name: Build Rust Prebuilt Binary

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build"
        required: true
        type: choice
        options:
          - dylint
          - pina
          - cargo-clean-all
          - cargo-interactive-update
          - sbpf-linker
          - keyring
          - ccase
      version:
        description: "Version to build (without v prefix)"
        required: true
        type: string
      update-package:
        description: "Update package.nix after building (for automated updates)"
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.config.outputs.repo }}
      bin: ${{ steps.config.outputs.bin }}
      features: ${{ steps.config.outputs.features }}
      no-default-features: ${{ steps.config.outputs.no-default-features }}
      tag: ${{ steps.config.outputs.tag }}
      ref: ${{ steps.config.outputs.ref }}
      matrix: ${{ steps.config.outputs.matrix }}
      locked: ${{ steps.config.outputs.locked }}
    steps:
      - name: Configure package
        id: config
        run: |
          VERSION="${{ inputs.version }}"
          echo "tag=prebuilt/${{ inputs.package }}/${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ref=v${VERSION}" >> "$GITHUB_OUTPUT"

          echo 'matrix={"include":[{"target":"aarch64-apple-darwin","os":"macos-latest"},{"target":"x86_64-apple-darwin","os":"macos-latest"},{"target":"aarch64-unknown-linux-gnu","os":"ubuntu-24.04-arm"},{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest"}]}' >> "$GITHUB_OUTPUT"

          case "${{ inputs.package }}" in
            dylint)
              echo "repo=trailofbits/dylint" >> "$GITHUB_OUTPUT"
              echo "bin=cargo-dylint,dylint-link" >> "$GITHUB_OUTPUT"
              ;;
            pina)
              echo "repo=pina-rs/pina" >> "$GITHUB_OUTPUT"
              echo "bin=pina" >> "$GITHUB_OUTPUT"
              ;;
            cargo-clean-all)
              echo "repo=dnlmlr/cargo-clean-all" >> "$GITHUB_OUTPUT"
              echo "bin=cargo-clean-all" >> "$GITHUB_OUTPUT"
              ;;
            cargo-interactive-update)
              echo "repo=benjeau/cargo-interactive-update" >> "$GITHUB_OUTPUT"
              echo "bin=cargo-interactive-update" >> "$GITHUB_OUTPUT"
              echo "ref=${VERSION}" >> "$GITHUB_OUTPUT"
              ;;
            sbpf-linker)
              echo "repo=blueshift-gg/sbpf-linker" >> "$GITHUB_OUTPUT"
              echo "bin=sbpf-linker" >> "$GITHUB_OUTPUT"
              echo "ref=06b4e60fba2960f6ec6c433659a88931da934546" >> "$GITHUB_OUTPUT"
              echo "features=upstream-gallery-22" >> "$GITHUB_OUTPUT"
              echo "no-default-features=true" >> "$GITHUB_OUTPUT"
              echo "locked=false" >> "$GITHUB_OUTPUT"
              ;;
            keyring)
              echo "repo=open-source-cooperative/keyring-rs" >> "$GITHUB_OUTPUT"
              echo "bin=keyring" >> "$GITHUB_OUTPUT"
              ;;
            ccase)
              echo "repo=stringcase/ccase" >> "$GITHUB_OUTPUT"
              echo "bin=ccase" >> "$GITHUB_OUTPUT"
              echo "ref=${VERSION}" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        if: inputs.package == 'dylint'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y pkg-config libssl-dev libgit2-dev zlib1g-dev
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install openssl libgit2 zlib pkg-config
          fi

      - name: Install system dependencies (cargo-interactive-update)
        if: inputs.package == 'cargo-interactive-update'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y pkg-config libcurl4-openssl-dev
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install curl pkg-config
          fi

      - name: Install system dependencies (keyring)
        if: inputs.package == 'keyring' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install LLVM (sbpf-linker)
        if: inputs.package == 'sbpf-linker'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y software-properties-common wget
            # Add LLVM apt repository for LLVM 22
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
            sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main"
            sudo apt-get update
            sudo apt-get install -y llvm-22-dev clang-22
            echo "LLVM_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install llvm@22
            echo "LLVM_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"
          fi

      - name: Build binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ${{ needs.prepare.outputs.bin }}
          target: ${{ matrix.target }}
          archive: ${{ inputs.package }}-$target
          tar: unix
          checksum: sha256
          features: ${{ needs.prepare.outputs.features }}
          no-default-features: ${{ needs.prepare.outputs.no-default-features || 'false' }}
          locked: ${{ needs.prepare.outputs.locked != '' && needs.prepare.outputs.locked || 'true' }}
          ref: ${{ needs.prepare.outputs.tag }}
          dry-run: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256

  release:
    name: Create release and upload binaries
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create release and upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ inputs.package }} ${{ inputs.version }}
          body: |
            Prebuilt binaries for ${{ inputs.package }} v${{ inputs.version }}

            ## Platforms
            - aarch64-apple-darwin (macOS ARM)
            - x86_64-apple-darwin (macOS Intel)
            - aarch64-unknown-linux-gnu (Linux ARM)
            - x86_64-unknown-linux-gnu (Linux x86)

            ## Usage
            These binaries are built automatically for use with Nix packages.
          files: artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-package:
    name: Update package.nix
    needs: [prepare, release]
    if: inputs.update-package == true && always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout nixpkgs repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get release hashes and update package.nix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE="${{ inputs.package }}"
          VERSION="${{ inputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          FILE="packages/${PACKAGE}/package.nix"

          echo "Fetching hashes for ${TAG}..."

          # Platform mapping for hash keys in package.nix
          declare -A PLATFORM_MAP=(
            ["aarch64-apple-darwin"]="aarch64-apple-darwin"
            ["x86_64-apple-darwin"]="x86_64-apple-darwin"
            ["aarch64-unknown-linux-gnu"]="aarch64-unknown-linux-gnu"
            ["x86_64-unknown-linux-gnu"]="x86_64-unknown-linux-gnu"
          )

          # Get all release assets
          ASSETS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].name')

          # Update version
          sed -i "s/version = \"[^\"]*\"/version = \"${VERSION}\"/" "${FILE}"

          # For each platform, download and compute hash
          for PLATFORM in "${!PLATFORM_MAP[@]}"; do
            ASSET_NAME="${PACKAGE}-${PLATFORM}.tar.gz"
            if echo "${ASSETS}" | grep -q "${ASSET_NAME}"; then
              URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET_NAME}"
              echo "Computing hash for ${PLATFORM}..."
              HASH=$(nix hash to-sri --type sha256 $(nix-prefetch-url "${URL}" 2>/dev/null) 2>/dev/null)
              echo "${PLATFORM}: ${HASH}"

              # Update the hash in package.nix.
              python3 -c 'import pathlib, re, sys; path = pathlib.Path(sys.argv[1]); platform = sys.argv[2]; hash_value = sys.argv[3]; text = path.read_text(); text = re.sub(r"\"" + re.escape(platform) + r"\" = (?:\"sha256-[^\"]*\"|lib\.fakeHash)", "\"" + platform + "\" = \"" + hash_value + "\"", text); path.write_text(text)' "${FILE}" "${PLATFORM}" "${HASH}"
            fi
          done

          echo "Updated ${FILE}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git diff --name-only)" ]; then
            git add -A
            git commit -m "chore(${{ inputs.package }}): update to v${{ inputs.version }}"
            git push
          else
            echo "No changes detected."
          fi
